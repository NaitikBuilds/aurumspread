[project]
name = "aurumspread"
version = "0.1.0"
description = "Cost-aware relative-value intelligence for MCX gold futures"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "pyarrow>=15", "pyyaml>=6", "requests>=2.31", "pydantic>=2.6",
  "streamlit>=1.35", "plotly>=5.20",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
